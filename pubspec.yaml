name: pimenton
description: "Pimenton: A Flutter application for collecting, importing, and sharing food recipes."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.2.2
  file_picker: ^13.3.3
  share_plus: ^13.0.0
  path_provider: ^2.1.2
  archive: ^4.6.0
  http: ^1.2.0
  html: ^0.15.4
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
